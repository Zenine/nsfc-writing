name: nsfc-writing
version: 0.2.0
description: >
  加载清单，也是参考文件加载条件的唯一出处。core 每次必读，sections 按用户
  涉及的章节读，references 按下列条件读。

always_load:
  - core/stance.md
  - core/science-question.md
  - core/reviewer-lens.md

axes:
  task:
    detect: |
      用户给出材料要求写出新文字 → draft；给出已有文字要求改 → revise；
      要求“看看问题、打分、评审意见” → diagnose；要求交稿前检查 → check；
      询问提纲、篇幅、经费方式、研究属性、期限等规定 → qa（不填工作表、不写正文）。
    values: [draft, revise, diagnose, check, qa]
    default: draft
  section:
    detect: 按用户点名的部分判断，可多选；整本起草时按提纲顺序逐节加载；qa 不选章节。
    values:
      topic-title: sections/topic-title.md
      abstract: sections/abstract.md
      english: sections/english.md
      rationale: sections/rationale.md
      content-aims-questions: sections/content-aims-questions.md
      plan-roadmap: sections/plan-roadmap.md
      figures: sections/figures.md
      innovation: sections/innovation.md
      schedule-outcomes: sections/schedule-outcomes.md
      foundation: sections/foundation.md
      budget: sections/budget.md
    multi: true
  program:
    detect: 用户说明的项目类型；未说明时默认青C，并在判断行中写出。
    values: [youth-c, general, regional, key, joint, provincial]
    default: youth-c

references:
  on_demand:
    - condition: task 为 qa，或涉及提纲结构、篇幅、研究期限、研究属性、经费方式、代表作、生成式人工智能声明与标识、伦理审查等硬要求，或研究涉及人体样本、临床数据、实验动物
      path: references/policy-2026.md
    - condition: program 不是 youth-c，或年度计划、预算、篇幅与项目类型有关
      path: references/programs.md
    - condition: 起草或修改任何正文
      path: references/wording.md
    - condition: task 为 diagnose，或用户说流水账、没亮点、太技术、AI味
      path: references/diagnosis.md
    - condition: task 为 check，或整本交稿前
      path: references/checklist.md
    - condition: 用户要借助大模型自查、仿写、按往年评审意见修改
      path: references/ai-assist.md
    - condition: 用户要完整示例，或不清楚科学问题如何贯穿全本
      path: references/worked-example.md
    - condition: 用户想参考往年获资助项目、结题报告，或已提供本地结题报告文件
      path: references/past-reports.md

scripts:
  - path: scripts/count_chars.py
    use: 统计摘要、题目等文字的字数（不含空白），python3 调用
  - path: scripts/merge_pages.py
    use: 把本地保存的结题报告页面图片合并为 PDF，python3 调用，需要 Pillow
